# =============================================================================
# task-manager-packages — Publish Docker Images
# =============================================================================
# Repo public này là "nhà" của các GHCR package. Workflow chạy TẠI ĐÂY (không
# phải trong task-manager) nên package tạo ra tự động:
#   - link vào repo task-manager-packages (sidebar Packages của repo này)
#   - visibility PUBLIC (theo visibility của repo chạy workflow)
#
# Trigger:
#   - repository_dispatch từ task-manager (caller mỏng dùng SUBMODULE_TOKEN):
#       event_type: publish-server | publish-web | publish-migrator
#       client_payload: { ref, version, branch }
#   - workflow_dispatch thủ công (inputs: image, ref, version, branch)
#
# Yêu cầu secret: SUBMODULE_TOKEN (PAT scope repo — checkout task-manager private)
# =============================================================================

name: Publish Docker Images
run-name: "${{ github.workflow }} · ${{ github.event.action || inputs.image }} · ${{ github.event.client_payload.branch || inputs.branch || 'main' }} · tag ${{ github.event.client_payload.version || inputs.version || 'auto' }}"

on:
  repository_dispatch:
    types: [publish-server, publish-web, publish-migrator]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image cần publish'
        required: true
        type: choice
        options: [server, web, migrator]
      ref:
        description: 'Commit SHA của task-manager cần build (bỏ trống = head của branch)'
        required: false
        type: string
      version:
        description: 'Version tag (bỏ trống = lấy từ source)'
        required: false
        type: string
      branch:
        description: 'Lane (main/dev) — quyết định hậu tố -dev trên tên image'
        required: false
        type: string
        default: main

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve source ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve
        id: ref
        uses: actions/github-script@v9
        env:
          REF_IN: ${{ github.event.client_payload.ref || inputs.ref || '' }}
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
        with:
          github-token: ${{ secrets.SUBMODULE_TOKEN }}
          script: |
            let ref = process.env.REF_IN;
            if (!ref) {
              const b = await github.rest.repos.getBranch({
                owner: 'phu-nam-hai-jsco', repo: 'task-manager', branch: process.env.BRANCH,
              });
              ref = b.data.commit.sha;
              core.info(`Resolved ${process.env.BRANCH} head: ${ref}`);
            }
            core.setOutput('ref', ref);

  server:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'publish-server') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'server')
    needs: resolve
    uses: phu-nam-hai-jsco/task-manager-action/.github/workflows/publish-docker-api.yml@main
    secrets: inherit
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      source_repository: phu-nam-hai-jsco/task-manager
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      branch: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}

  # NEXT_PUBLIC_* được bake vào bundle lúc build → PHẢI truyền qua build-arg ở đây.
  # Thiếu env_json thì NEXT_PUBLIC_API_BASE_URL rỗng và URL media (/uploads/...) bị
  # trình duyệt ghép với host của web thay vì host API.
  web-env:
    name: Resolve web build env
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'publish-web') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'web')
    runs-on: ubuntu-latest
    outputs:
      env_json: ${{ steps.env.outputs.env_json }}
    steps:
      - name: Build env_json
        id: env
        env:
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          # Ghi đè toàn bộ JSON bằng repo variable (tuỳ chọn), ví dụ để thêm Sentry/AG Grid.
          OVERRIDE_MAIN: ${{ vars.WEB_ENV_JSON_MAIN }}
          OVERRIDE_DEV: ${{ vars.WEB_ENV_JSON_DEV }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            DEFAULT='{"BUILD_ENV":"production","NEXT_PUBLIC_API_BASE_URL":"https://api.phunamhai.com","INTERNAL_API_BASE_URL":"http://prod-api:8888","NEXT_PUBLIC_DEBUG":"false"}'
            JSON="${OVERRIDE_MAIN:-$DEFAULT}"
          else
            DEFAULT='{"BUILD_ENV":"development","NEXT_PUBLIC_API_BASE_URL":"https://api-qlcv.tannhatcms.io.vn","INTERNAL_API_BASE_URL":"http://dev-api:8888","NEXT_PUBLIC_DEBUG":"true"}'
            JSON="${OVERRIDE_DEV:-$DEFAULT}"
          fi
          echo "$JSON" | jq -e 'type == "object"' > /dev/null
          echo "env_json=$(echo "$JSON" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Lane: $BRANCH → NEXT_PUBLIC_API_BASE_URL=$(echo "$JSON" | jq -r '.NEXT_PUBLIC_API_BASE_URL // ""')"

  web:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'publish-web') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'web')
    needs: [resolve, web-env]
    uses: phu-nam-hai-jsco/task-manager-action/.github/workflows/publish-docker-web.yml@main
    secrets: inherit
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      source_repository: phu-nam-hai-jsco/task-manager
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      branch: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
      env_json: ${{ needs.web-env.outputs.env_json }}

  migrator:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'publish-migrator') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'migrator')
    needs: resolve
    uses: phu-nam-hai-jsco/task-manager-action/.github/workflows/publish-docker-migrator.yml@main
    secrets: inherit
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      source_repository: phu-nam-hai-jsco/task-manager
      version: ${{ github.event.client_payload.version || inputs.version || '' }}
      branch: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
